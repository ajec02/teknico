<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Teknico OS - Sistema de Gestão de Bases de Dados MySQL">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Teknico OS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Teknico OS - Gestão de Bases de Dados</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #0B0C0E;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #FFFFFF;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .loading-container {
      text-align: center;
      background-color: #141519;
      padding: 32px 40px;
      border-radius: 20px;
      border: 1.5px solid rgba(255, 107, 0, 0.4);
      box-shadow: 0 0 30px rgba(255, 107, 0, 0.25);
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 107, 0, 0.15);
      border-top: 4px solid #FF6B00;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px auto;
      filter: drop-shadow(0 0 8px rgba(255, 107, 0, 0.6));
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .brand-badge {
      display: inline-block;
      background-color: #FF6B00;
      color: #FFFFFF;
      font-weight: 900;
      font-size: 15px;
      padding: 6px 14px;
      border-radius: 8px;
      letter-spacing: 1.2px;
      box-shadow: 0 0 12px rgba(255, 107, 0, 0.4);
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="loading-container" id="loading">
    <div class="spinner"></div>
    <div class="brand-badge">TEKNICO OS</div>
    <div style="font-size: 13px; color: #9CA3AF; font-weight: 500;">A carregar a aplicação...</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
